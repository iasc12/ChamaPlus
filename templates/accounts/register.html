{% extends "base.html" %}

{% block title %}Create Account - ChamaPlus{% endblock %}

{% block content %}

<div style="max-width: 520px; margin: 50px auto;">
    <div class="card">

        <h1>Create your ChamaPlus account</h1>

        <p style="color:#667085;">
            Create an account and enjoy your first
            <strong>14 days free</strong>.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Phone number</label>
                <input type="text" name="phone_number" placeholder="07XXXXXXXX">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Confirm password</label>
                <input type="password" name="password_confirm" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Create account
            </button>
        </form>

        <p style="margin-top:20px;">
            Already have an account?
            <a href="{% url 'login' %}" style="font-weight:700;">
                Login
            </a>
        </p>

    </div>
</div>

{% endblock %}
