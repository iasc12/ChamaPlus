{% extends "base.html" %}

{% block title %}Create Treasurer - ChamaPlus{% endblock %}

{% block content %}
    <a href="{% url "chama_management" %}" class="back-link">
        <span class="back-link-icon">←</span>
        <span>Back</span>
    </a>


<style>
.treasurer-page {
    max-width: 700px;
    margin: 0 auto;
}

.treasurer-header {
    margin-bottom: 24px;
}

.treasurer-header h1 {
    margin: 0 0 6px;
    font-size: 28px;
}

.treasurer-header p {
    margin: 0;
    color: #6b7280;
}

.form-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 15px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
}

.btn {
    display: inline-block;
    padding: 13px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    border: 0;
    cursor: pointer;
}

.btn-primary {
    background: #111827;
    color: #ffffff;
}

.btn-secondary {
    background: #f3f4f6;
    color: #111827;
}

@media (max-width: 600px) {
    .form-row {
        grid-template-columns: 1fr;
    }

    .form-card {
        padding: 18px;
        border-radius: 18px;
    }

    .actions {
        flex-direction: column;
    }

    .btn {
        text-align: center;
    }
}
</style>

<div class="treasurer-page">

    <div class="treasurer-header">
        <h1>Create Treasurer</h1>
        <p>Create a separate account for the Chama treasurer.</p>
    </div>

    <div class="form-card">

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="first_name">First name</label>
                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last_name">Last name</label>
                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                >
            </div>

            <div class="form-group">
                <label for="phone_number">Phone number</label>
                <input
                    type="text"
                    id="phone_number"
                    name="phone_number"
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirm password</label>
                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        required
                        autocomplete="new-password"
                    >
                </div>

            </div>

            <div class="actions">

                <a
                    href="{% url 'chama_management' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Treasurer
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
